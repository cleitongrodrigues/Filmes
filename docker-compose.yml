services:
  auth-service:
    build:
      context: ./auth-service
    container_name: cine-magico-auth-service
    environment:
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      MAILTRAP_HOST: ${MAILTRAP_HOST}
      MAILTRAP_PORT: ${MAILTRAP_PORT}
      MAILTRAP_USER: ${MAILTRAP_USER}
      MAILTRAP_PASS: ${MAILTRAP_PASS}
      MAILTRAP_FROM: ${MAILTRAP_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    restart: unless-stopped
    networks:
      - cine-network

  backend:
    build:
      context: ./backend
    container_name: cine-magico-backend
    ports:
      - "3000:3000"
    environment:
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_DIALECT: ${DB_DIALECT}
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_BASE_URL: ${TMDB_BASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    depends_on:
      auth-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cine-network

  frontend:
    build:
      context: ./frontend
    container_name: cine-magico-frontend
    ports:
      - "8201:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cine-network

  redis:
    image: redis:7-alpine
    container_name: cine-magico-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cine-network

  log-service:
    build:
      context: ./log-service
    container_name: cine-magico-log-service
    environment:
      LOG_SERVICE_PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cine-network

networks:
  cine-network:
    driver: bridge
